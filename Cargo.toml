[workspace]
resolver = "2"
members = [
    "crates/iris-macros",
    "crates/iris-core",
    "crates/iris-render",
    "crates/iris-platform",
    "crates/iris-audio",
    "crates/iris-engine",
    "crates/iris-editor",
    # dogfooding 游戏统一放在根级 games/ 下，与引擎 crate 分离
    "games/iris-game",
    "games/iris-arena",
    "games/iris-bastion",
    "games/iris-ascent",
    "games/iris-infiltration",
    "games/iris-assault",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Iris Engine Contributors"]

[workspace.dependencies]
# 内部 crate
iris-macros = { path = "crates/iris-macros", version = "0.1.0" }
iris-core = { path = "crates/iris-core", version = "0.1.0" }
iris-render = { path = "crates/iris-render", version = "0.1.0" }
iris-platform = { path = "crates/iris-platform", version = "0.1.0" }
iris-audio = { path = "crates/iris-audio", version = "0.1.0" }
iris-engine = { path = "crates/iris-engine", version = "0.1.0" }
iris-game = { path = "games/iris-game", version = "0.1.0" }
iris-arena = { path = "games/iris-arena", version = "0.1.0" }
iris-bastion = { path = "games/iris-bastion", version = "0.1.0" }
iris-ascent = { path = "games/iris-ascent", version = "0.1.0" }
iris-infiltration = { path = "games/iris-infiltration", version = "0.1.0" }
iris-assault = { path = "games/iris-assault", version = "0.1.0" }
iris-editor = { path = "crates/iris-editor", version = "0.1.0" }

# 数学：SIMD 优化的线性代数库
glam = "0.33"
# 跨平台图形后端：Vulkan / DirectX 12 / Metal / WebGPU
wgpu = "30"
# 跨平台窗口与输入
winit = "0.30"
# POD 转换（GPU 缓冲安全上传）
bytemuck = { version = "1.25", features = ["derive"] }
# 同步阻塞执行器（wgpu 的异步 API）
pollster = "0.4"
# 日志门面与实现
log = "0.4"
env_logger = "0.11"

# 基准框架（dev-dependencies 专属，不进任何运行时依赖树）：
# CPU 纯函数路径的正式基准（R33），默认 features（含 plotters 报告）
criterion = "0.7"

# 发布构建：更小体积、更快运行
[profile.release]
opt-level = 3
strip = "debuginfo"
