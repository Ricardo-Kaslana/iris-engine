[package]
name = "iris-exp"
description = "Iris 引擎实验性项目：外部 GLB 角色（Mixamo 重定向动作）导入验证——渲染 / 蒙皮动画 / 动作切换的最小实弹环境"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 依赖纪律与 iris-assault 同款：logic / 插件层只依赖引擎门面
# iris-engine + iris-core 的纯函数，非引擎依赖线只留 glam / log。
[dependencies]
iris-core = { workspace = true }
iris-engine = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
