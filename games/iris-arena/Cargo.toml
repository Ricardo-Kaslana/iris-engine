[package]
name = "iris-arena"
description = "Iris 引擎下游示范游戏 II：Iris Arena 波次生存竞技场（dogfooding II——蒙皮动画 × 对象池 × 弹道 × 追击 AI 的高强度真实用法）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 依赖方向：iris-arena 与 iris-game 同为引擎最下游消费者（用户视角）。
# 除 glam（logic.rs 的纯数学核心）外只允许依赖引擎门面 iris-engine
# （iris-core 用于 Collider / Resource 等引擎类型的接入实现）。
[dependencies]
iris-core = { workspace = true }
iris-engine = { workspace = true }
glam = { workspace = true }
# 场景 / glTF 加载失败的 log::error 告警（log 已在全 workspace 依赖树内，无新 crate）
log = { workspace = true }
