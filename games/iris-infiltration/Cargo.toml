[package]
name = "iris-infiltration"
description = "Iris 引擎下游示范游戏 V：Iris Infiltration 第三人称潜入（dogfooding V——R35 NavGrid 寻路 × R38 动画 v3 混合空间/足部 IK × R37 ragdoll × R34 接触事件 sensor × R40 RTT 监控屏 × R41 UI 菜单栈 × R36 距离关节弹簧门的高强度真实用法）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 依赖方向：iris-infiltration 与 iris-ascent 等同为引擎最下游消费者（用户
# 视角）。logic.rs 的纯逻辑核心只依赖 glam + iris-core 的纯函数
# （move_and_slide_statics / ColliderShape / segment_hits_shape /
# NavGrid——刻意 dogfooding：移动就是引擎角色控制器、寻路就是引擎
# NavGrid、视线遮挡就是引擎射线纯函数，headless 与窗口走同一模拟）；
# 插件层只允许依赖引擎门面 iris-engine。
[dependencies]
iris-core = { workspace = true }
iris-engine = { workspace = true }
glam = { workspace = true }
# 场景 / 资产加载失败的 log 告警（log 已在全 workspace 依赖树内，无新 crate）
log = { workspace = true }
