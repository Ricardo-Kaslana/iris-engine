[package]
name = "iris-render"
description = "Iris 引擎渲染层：基于 wgpu 的现代 GPU 渲染器（MSAA、自动实例化批处理、Blinn-Phong 光照）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
iris-core = { workspace = true }
# UI 焦点导航 / 点击消费 input.rs 的 Input 资源（platform 不依赖 render，无环）
iris-platform = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pollster = { workspace = true }
log = { workspace = true }
# glTF 2.0 资产管线
serde = { version = "1", features = ["derive"] }
serde_json = "1"
	image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
criterion = { workspace = true }

# criterion 基准（harness = false：基准自管 main，见 benches/render_cpu.rs）
[[bench]]
name = "render_cpu"
harness = false
