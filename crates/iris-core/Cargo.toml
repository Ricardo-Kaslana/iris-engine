[package]
name = "iris-core"
description = "Iris 引擎核心：实体组件系统（ECS）、系统调度、时间管理与数学库"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
iris-macros = { workspace = true }
glam = { workspace = true }
log = { workspace = true }

# 平台原因（wasm32）：std::time::Instant 运行时 panic，src/instant.rs 改用
# performance.now() 作时间源，需要 Window + Performance 两个 feature。
# web-sys 已在 wgpu / winit 的 wasm 依赖树内，不产生新编译单元；
# native 构建完全不引入此依赖。
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance"] }
