[package]
name = "iris-assault"
description = "Iris 引擎下游示范游戏 VI：Iris Assault 写实战斗庭院（dogfooding VI——R42 写实材质 × R43 DOF/MB × R44 流式音频 × R45 pack 资产 × R46 动画 v4 附加层/遮罩/手 IK × R47 演出时间线的高强度真实用法）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 依赖方向：iris-assault 与 iris-game / iris-arena / iris-bastion /
# iris-ascent / iris-infiltration 同为引擎最下游消费者（用户视角）。
# logic.rs 的纯逻辑核心只依赖 glam + iris-core 的纯函数
# （move_and_slide_statics / ColliderShape / ray_vs_shape / NavGrid——
# 刻意 dogfooding：移动就是引擎角色控制器、追击就是引擎 NavGrid、
# 弹道遮挡就是引擎射线纯函数，headless 与窗口走同一模拟）；插件层只
# 允许依赖引擎门面 iris-engine。
[dependencies]
iris-core = { workspace = true }
iris-engine = { workspace = true }
# 与门面纪律的显式偏离（记入 ARCHITECTURE §8 摩擦清单）：R45 的 GLB
# 内存加载入口 spawn_gltf_instance_from_bytes 未进 iris-render 的
# prelude，门面依赖的下游 crate 无法经 iris_engine::prelude 直达——
# pack 路径是本作的一级载荷，故直依 iris-render 使用该公开 API。
# 建议修法：把内存入口补进 iris-render prelude（引擎轮闭合）。
iris-render = { workspace = true }
glam = { workspace = true }
# 场景 / 资产加载失败的 log 告警（log 已在全 workspace 依赖树内，无新 crate）
log = { workspace = true }
