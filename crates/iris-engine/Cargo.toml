[package]
name = "iris-engine"
description = "Iris 3D 游戏引擎门面：App 框架、插件系统与主循环，跨平台 / 内存安全 / 高性能 / 低占用"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
iris-core = { workspace = true }
# 空间音频系统（spatial.rs）的三维数学；与 iris-render / iris-arena 同款直依赖
glam = { workspace = true }
iris-render = { workspace = true }
iris-platform = { workspace = true }
iris-audio = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
# 场景序列化（JSON 双向）。serde / serde_json / image 均已在依赖树内
# （iris-render 的 glTF 管线在用），此处复用同版本，Cargo.lock 不出现新版本号
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
env_logger = { workspace = true }
# game_snapshot / arena_snapshot 示例复用下游游戏 crate（dev 依赖允许与
# iris-game / iris-arena 的正常依赖形成环：cargo 保证普通依赖单向、
# dev 依赖可回指）
iris-game = { workspace = true }
iris-arena = { workspace = true }
